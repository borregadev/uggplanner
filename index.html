                padding: 3px !important;

            /* High-contrast print style for current day badge */

                color: #1e293b !important;
                font-weight: bold !important;
                border: none !important;
                box-shadow: none !important;
                -webkit-print-color-adjust: unset !important;
                print-color-adjust: unset !important;
            }

            .event-pill {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                font-size: 7.5pt !important;
                padding: 1px 3px !important;
                margin-bottom: 1px !important;
                line-height: 1.1 !important;
            }
        }

        /* Screen-specific utility scrollbars */
        .month-tabs-scroll::-webkit-scrollbar {
            height: 6px;
        }

        .month-tabs-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;

<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col overflow-x-hidden">

                    <button id="add-event-btn"

                        <span>Add<span class="hidden xs:inline"> Event</span></span>
                    </button>

                    <button onclick="window.print()"

                        <span class="hidden sm:inline">Save as PDF</span>

            </div>

            </div>
            <div class="grid grid-cols-2 sm:flex items-center gap-2 sm:gap-3">

        <span id="status-toast-msg">Backup restored</span>

    <!-- Add / Edit Event Modal -->

                        <button type="submit"

                            Save Event
                        </button>
                    </div>
                </div>
            </form>
        </div>

                <button id="delete-following-btn"

                    <span>This and following events</span>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                </button>
                <button id="delete-all-btn"

                    <span>All events in series</span>
                    <i class="fa-solid fa-chevron-right text-xs text-red-200"></i>

            <button id="cancel-delete-modal-btn"
                class="mt-4 py-2 px-4 text-xs font-semibold text-slate-500 hover:text-slate-800 transition min-h-[40px]">
                Cancel

        </div>
    </div>

            { id: "indigo", bg: "bg-indigo-100", text: "text-indigo-800", border: "border-indigo-300", dot: "bg-indigo-600" },
            { id: "teal", bg: "bg-teal-100", text: "text-teal-800", border: "border-teal-300", dot: "bg-teal-600" },
            { id: "cyan", bg: "bg-cyan-100", text: "text-cyan-800", border: "border-cyan-300", dot: "bg-cyan-600" },
            { id: "violet", bg: "bg-violet-100", text: "text-violet-800", border: "border-violet-300", dot: "bg-violet-600" },
            { id: "pink", bg: "bg-pink-100", text: "text-pink-800", border: "border-pink-300", dot: "bg-pink-600" },
            { id: "orange", bg: "bg-orange-100", text: "text-orange-800", border: "border-orange-300", dot: "bg-orange-600" },
            { id: "slate", bg: "bg-slate-200", text: "text-slate-800", border: "border-slate-400", dot: "bg-slate-600" }
        ];

        let activeMonthIndex = 0;
        let events = [];
        let pendingDeleteEvent = null;
        let db = null;
        let cloudReady = false;
        let lastSyncError = "";

        const $ = (id) => document.getElementById(id);

        function showToast(msg, isError = false) {
            const toast = $("status-toast");
            const text = $("status-toast-msg");
            const icon = $("status-toast-icon");
            if (!toast || !text) return;
            text.textContent = msg;
            if (icon) {
                icon.className = isError
                    ? "fa-solid fa-circle-exclamation text-rose-400"
                    : "fa-solid fa-circle-check text-emerald-400";
            }
            toast.classList.remove("hidden");
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.add("hidden"), 3500);
        }

        function setSyncStatus(state, label, detail = "") {
            const dot = $("cloud-sync-dot");
            const text = $("cloud-sync-text");
            const pill = $("cloud-sync-pill");
            lastSyncError = detail;
            if (!dot || !text) return;
            text.textContent = label;
            if (pill && detail) pill.title = detail;
            dot.className = "w-1.5 h-1.5 rounded-full ";
            if (state === "synced") {
                dot.className += "bg-emerald-500";
            } else if (state === "syncing") {
                dot.className += "bg-amber-400 animate-pulse";
            } else if (state === "error") {
                dot.className += "bg-rose-500";
            } else {
                dot.className += "bg-slate-400";
            }
        }

        function isFirebaseConfigured() {
            return (
                firebaseConfig &&
                firebaseConfig.apiKey &&
                firebaseConfig.projectId &&
                firebaseConfig.apiKey !== "YOUR_API_KEY_HERE" &&
                firebaseConfig.projectId !== "YOUR_PROJECT_ID"
            );
        }

        function loadLocalEvents() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                events = Array.isArray(parsed) ? parsed : [];
            } catch {
                events = [];
            }
        }

        async function pushEventsToCloud() {
            if (!cloudReady || !db) return;
            setSyncStatus("syncing", "Saving...");
            try {
                const docRef = doc(db, FIRESTORE_DOC_PATH[0], FIRESTORE_DOC_PATH[1]);
                await setDoc(docRef, {
                    updatedAt: new Date().toISOString(),
                    events: events
                });
                setSyncStatus("synced", "Live Sync", "Connected to Firebase Firestore");
            } catch (err) {
                console.error("Firestore save error:", err);
                const msg = err?.code || err?.message || "Firestore write failed";
                setSyncStatus("error", "Sync Error", msg);
                showToast(`Sync Error: ${msg}`, true);
            }
        }

        function saveEvents() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
            pushEventsToCloud();
        }

        async function initFirebaseSync() {
            if (!isFirebaseConfigured()) {
                setSyncStatus("local", "Local", "Paste your firebaseConfig into calendar.html to enable Live Sync");
                return;
            }

            setSyncStatus("syncing", "Connecting...");
            try {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                db = getFirestore(app);

                await signInAnonymously(auth);
                cloudReady = true;

                const docRef = doc(db, FIRESTORE_DOC_PATH[0], FIRESTORE_DOC_PATH[1]);
                let initialSnapshotHandled = false;

                onSnapshot(
                    docRef,
                    (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.data();
                            if (Array.isArray(data?.events)) {
                                events = data.events;
                                localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
                                renderCalendar();
                            }
                        } else if (!initialSnapshotHandled && events.length > 0) {
                            pushEventsToCloud();
                        }
                        initialSnapshotHandled = true;
                        setSyncStatus("synced", "Live Sync", "Connected to Firebase Firestore");
                    },
                    (err) => {
                        console.error("Firestore listener error:", err);
                        const msg = err?.code || err?.message || "Firestore connection error";
                        setSyncStatus("error", "Sync Error", msg);
                        showToast(`Firebase Error: ${msg}`, true);
                    }
                );
            } catch (err) {
                console.error("Firebase init error:", err);
                const msg = err?.code || err?.message || "Could not initialize Firebase";
                setSyncStatus("error", "Sync Error", msg);
                showToast(`Firebase Error: ${msg}`, true);
            }
        }

        function formatDateKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, "0");
            const d = String(dateObj.getDate()).padStart(2, "0");
            return `${y}-${m}-${d}`;
        }

        function parseDateKey(str) {
            return new Date(`${str}T00:00:00`);
        }

        function getDurationDays(evt) {
            const s = parseDateKey(evt.startDate);
            const e = parseDateKey(evt.endDate || evt.startDate);
            return Math.max(1, Math.round((e - s) / 86400000) + 1);
        }

        function generateSeries(base) {
            const recurrence = base.recurrence || "none";
            const startObj = parseDateKey(base.startDate);
            const endObj = parseDateKey(base.endDate || base.startDate);
            const spanDays = Math.max(0, Math.round((endObj - startObj) / 86400000));
            const groupId = base.groupId || `grp_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;

            if (recurrence === "none") {
                return [{
                    ...base,
                    id: base.id || `evt_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                    groupId: null,
                    recurrence: "none"
                }];
            }

            const result = [];
            const limitObj = parseDateKey(SERIES_END_LIMIT);
            let idx = 0;

            while (true) {
                const curStart = new Date(startObj);
                if (recurrence === "daily") curStart.setDate(startObj.getDate() + idx);
                else if (recurrence === "weekly") curStart.setDate(startObj.getDate() + idx * 7);
                else if (recurrence === "biweekly") curStart.setDate(startObj.getDate() + idx * 14);
                else if (recurrence === "monthly") curStart.setMonth(startObj.getMonth() + idx);
                else if (recurrence === "yearly") curStart.setFullYear(startObj.getFullYear() + idx);

                if (curStart > limitObj || idx > 800) break;

                const curEnd = new Date(curStart);
                curEnd.setDate(curStart.getDate() + spanDays);

                result.push({
                    ...base,
                    id: `evt_${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 7)}`,
                    groupId,
                    startDate: formatDateKey(curStart),
                    endDate: formatDateKey(curEnd),
                    recurrence
                });
                idx++;
            }

            return result;
        }

        function renderMonthTabs() {
            const container = $("month-tabs");
            if (!container) return;
            container.innerHTML = "";

            MONTHS.forEach((m, idx) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = m.label;
                const active = idx === activeMonthIndex;
                btn.className = active
                    ? "flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow-xs transition"
                    : "flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-200/70 transition";

                btn.addEventListener("click", () => {
                    activeMonthIndex = idx;
                    renderCalendar();
                });

                container.appendChild(btn);
            });

            const activeBtn = container.children[activeMonthIndex];
            if (activeBtn) {
                activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
            }
        }

        function renderCalendar() {
            const cur = MONTHS[activeMonthIndex];
            const display = $("current-month-display");
            if (display) display.textContent = cur.full;

            renderMonthTabs();

            const grid = $("calendar-days-grid");
            if (!grid) return;
            grid.innerHTML = "";

            const firstDay = new Date(cur.year, cur.month, 1);
            const startOffset = (firstDay.getDay() + 6) % 7;
            const daysInMonth = new Date(cur.year, cur.month + 1, 0).getDate();
            const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
            const todayKey = formatDateKey(new Date());

            for (let i = 0; i < totalCells; i++) {
                const dayNum = i - startOffset + 1;
                const cellDate = new Date(cur.year, cur.month, dayNum);
                const dateKey = formatDateKey(cellDate);
                const inMonth = dayNum >= 1 && dayNum <= daysInMonth;
                const isToday = dateKey === todayKey;

                const cell = document.createElement("div");
                cell.className = `day-cell border-b border-r border-slate-200 p-1.5 sm:p-2 min-h-[84px] sm:min-h-[120px] flex flex-col transition cursor-pointer ${inMonth ? "bg-white hover:bg-slate-50" : "bg-slate-50/70 text-slate-400"
                    }`;

                cell.addEventListener("click", (e) => {
                    if (e.target.closest(".event-pill")) return;
                    openAddModal(dateKey);
                });

                const headerRow = document.createElement("div");
                headerRow.className = "flex items-center justify-between mb-1";

                const numSpan = document.createElement("span");
                numSpan.textContent = cellDate.getDate();
                if (isToday) {
                    numSpan.className =
                        "is-today-badge inline-flex items-center justify-center w-6 h-6 rounded-full bg-blue-600 text-white text-xs font-bold shadow-xs";
                } else {
                    numSpan.className = `text-xs font-semibold ${inMonth ? "text-slate-700" : "text-slate-400"}`;
                }
                headerRow.appendChild(numSpan);
                cell.appendChild(headerRow);

                const dayEvents = events.filter((evt) => {
                    const s = evt.startDate;
                    const e = evt.endDate || evt.startDate;
                    return dateKey >= s && dateKey <= e;
                });

                // Sort multi-day events to the top of the cell
                dayEvents.sort((a, b) => getDurationDays(b) - getDurationDays(a));

                const list = document.createElement("div");
                list.className = "flex flex-col gap-1 overflow-hidden";

                dayEvents.forEach((evt) => {
                    const c = COLORS.find((item) => item.id === evt.color) || COLORS[0];
                    const isMulti = evt.endDate && evt.endDate > evt.startDate;
                    let prefix = "";
                    if (isMulti) {
                        if (dateKey === evt.startDate) prefix = "▶ ";
                        else if (dateKey === evt.endDate) prefix = "◀ ";
                        else prefix = "↔ ";
                    }

                    const pill = document.createElement("button");
                    pill.type = "button";
                    pill.className = `event-pill w-full text-left px-1.5 py-0.5 rounded border text-[10px] sm:text-xs font-medium truncate transition hover:brightness-95 ${c.bg} ${c.text} ${c.border}`;
                    pill.textContent = `${prefix}${evt.title}`;
                    pill.title = evt.title;

                    pill.addEventListener("click", (e) => {
                        e.stopPropagation();
                        openEditModal(evt);
                    });

                    list.appendChild(pill);
                });

                cell.appendChild(list);
                grid.appendChild(cell);
            }
        }

        function renderColorSwatches(selectedId) {
            const container = $("color-picker-options");
            if (!container) return;
            container.innerHTML = "";

            COLORS.forEach((c) => {
                const btn = document.createElement("button");
                btn.type = "button";
                const active = c.id === selectedId;
                btn.className = `w-8 h-8 rounded-full ${c.dot} flex items-center justify-center text-white text-xs transition ${active ? "ring-2 ring-offset-2 ring-slate-900 scale-110" : "opacity-80 hover:opacity-100"
                    }`;
                btn.innerHTML = active ? '<i class="fa-solid fa-check"></i>' : "";

                btn.addEventListener("click", () => {
                    $("event-color").value = c.id;
                    renderColorSwatches(c.id);
                });

                container.appendChild(btn);
            });
        }

        function openAddModal(defaultDate) {
            $("modal-title").textContent = "Add All-Day Event";
            $("event-id").value = "";
            $("event-title").value = "";
            const fallbackDate = `${MONTHS[activeMonthIndex].year}-${String(MONTHS[activeMonthIndex].month + 1).padStart(2, "0")}-01`;
            $("event-start-date").value = defaultDate || fallbackDate;
            $("event-end-date").value = defaultDate || fallbackDate;
            $("event-recurrence").value = "none";
            $("event-color").value = "blue";
            renderColorSwatches("blue");
            $("delete-event-btn").classList.add("hidden");
            $("event-modal").classList.remove("hidden");
        }

        function openEditModal(evt) {
            $("modal-title").textContent = "Edit Event";
            $("event-id").value = evt.id;
            $("event-title").value = evt.title;
            $("event-start-date").value = evt.startDate;
            $("event-end-date").value = evt.endDate || evt.startDate;
            $("event-recurrence").value = evt.recurrence || "none";
            const colorId = evt.color || "blue";
            $("event-color").value = colorId;
            renderColorSwatches(colorId);
            $("delete-event-btn").classList.remove("hidden");
            $("event-modal").classList.remove("hidden");
        }

        function closeModal() {
            $("event-modal").classList.add("hidden");
        }

        function closeDeleteModal() {
            $("delete-recurring-modal").classList.add("hidden");
            pendingDeleteEvent = null;
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = $("event-id").value;
            const title = $("event-title").value.trim();
            const startDate = $("event-start-date").value;
            let endDate = $("event-end-date").value || startDate;
            if (endDate < startDate) endDate = startDate;
            const recurrence = $("event-recurrence").value;
            const color = $("event-color").value || "blue";

            if (!title || !startDate) return;

            let existingGroupId = null;
            if (editId) {
                const target = events.find((item) => item.id === editId);
                if (target && target.groupId) {
                    existingGroupId = target.groupId;
                    events = events.filter((item) => item.groupId !== existingGroupId);
                } else {
                    events = events.filter((item) => item.id !== editId);
                }
            }

            const generated = generateSeries({
                title,
                startDate,
                endDate,
                recurrence,
                color,
                groupId: recurrence !== "none" ? (existingGroupId || `grp_${Date.now()}`) : null
            });

            events.push(...generated);
            saveEvents();
            renderCalendar();
            closeModal();
        }

        function handleDeleteRequest() {
            const editId = $("event-id").value;
            const target = events.find((item) => item.id === editId);
            if (!target) return;

            if (target.groupId) {
                pendingDeleteEvent = target;
                $("delete-recurring-modal").classList.remove("hidden");
            } else {
                events = events.filter((item) => item.id !== target.id);
                saveEvents();
                renderCalendar();
                closeModal();
            }
        }

        function goToToday() {
            const now = new Date();
            const foundIdx = MONTHS.findIndex((m) => m.year === now.getFullYear() && m.month === now.getMonth());
            activeMonthIndex = foundIdx >= 0 ? foundIdx : 0;
            renderCalendar();
        }

        function exportBackup() {
            const payload = JSON.stringify({
                app: "UGG Knightsbridge Planner",
                exportedAt: new Date().toISOString(),
                events
            }, null, 2);
            const blob = new Blob([payload], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `ugg-knightsbridge-planner-${formatDateKey(new Date())}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast("Backup file downloaded");
        }

        async function importBackup(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            try {
                const raw = await file.text();
                let cleaned = raw.replace(/^\uFEFF/, "").trim();
                if (cleaned.startsWith("%7B") || cleaned.startsWith("%5B")) {
                    cleaned = decodeURIComponent(cleaned);
                }
                let parsed = JSON.parse(cleaned);
                if (typeof parsed === "string") parsed = JSON.parse(parsed);
                const list = Array.isArray(parsed) ? parsed : Array.isArray(parsed?.events) ? parsed.events : null;
                if (!list) throw new Error("Invalid format");

                events = list;
                saveEvents();
                renderCalendar();
                showToast(`Restored ${events.length} event${events.length === 1 ? "" : "s"}`);
            } catch {
                showToast("Could not read backup file", true);
            } finally {
                e.target.value = "";
            }
        }

        function initTouchSwipe() {
            const area = $("calendar-touch-area");
            if (!area) return;
            let startX = 0;
            let startY = 0;

            area.addEventListener("touchstart", (e) => {
                if (e.touches.length === 1) {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }
            }, { passive: true });

            area.addEventListener("touchend", (e) => {
                if (!startX || !startY) return;
                const dx = e.changedTouches[0].clientX - startX;
                const dy = e.changedTouches[0].clientY - startY;
                if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
                    if (dx < 0 && activeMonthIndex < MONTHS.length - 1) {
                        activeMonthIndex++;
                        renderCalendar();
                    } else if (dx > 0 && activeMonthIndex > 0) {
                        activeMonthIndex--;
                        renderCalendar();
                    }
                }
                startX = 0;
                startY = 0;
            }, { passive: true });
        }

        // Boot
        loadLocalEvents();
        goToToday();
        initTouchSwipe();
        initFirebaseSync();

        $("prev-month-btn")?.addEventListener("click", () => {
            if (activeMonthIndex > 0) {
                activeMonthIndex--;
                renderCalendar();
            }
        });

        $("next-month-btn")?.addEventListener("click", () => {
            if (activeMonthIndex < MONTHS.length - 1) {
                activeMonthIndex++;
                renderCalendar();
            }
        });

        $("today-btn")?.addEventListener("click", goToToday);
        $("add-event-btn")?.addEventListener("click", () => openAddModal());
        $("close-modal-btn")?.addEventListener("click", closeModal);
        $("cancel-modal-btn")?.addEventListener("click", closeModal);
        $("event-form")?.addEventListener("submit", handleFormSubmit);
        $("delete-event-btn")?.addEventListener("click", handleDeleteRequest);
        $("save-backup-btn")?.addEventListener("click", exportBackup);
        $("restore-file-input")?.addEventListener("change", importBackup);

        $("cloud-sync-pill")?.addEventListener("click", () => {
            if (lastSyncError) {
                showToast(`Status: ${lastSyncError}`, true);
            } else if (cloudReady) {
                pushEventsToCloud();
                showToast("Synced with Firebase");
            } else {
                showToast("Add your firebaseConfig in calendar.html to enable Live Sync");
            }
        });

        $("event-start-date")?.addEventListener("change", (e) => {
            if ($("event-end-date").value < e.target.value) {
                $("event-end-date").value = e.target.value;
            }
        });

        $("delete-single-btn")?.addEventListener("click", () => {
            if (!pendingDeleteEvent) return;
            events = events.filter((item) => item.id !== pendingDeleteEvent.id);
            saveEvents();
            renderCalendar();
            closeDeleteModal();
            closeModal();
        });

        $("delete-following-btn")?.addEventListener("click", () => {
            if (!pendingDeleteEvent) return;
            const cutoff = pendingDeleteEvent.startDate;
            const gid = pendingDeleteEvent.groupId;
            events = events.filter((item) => !(item.groupId === gid && item.startDate >= cutoff));
            saveEvents();
            renderCalendar();
            closeDeleteModal();
            closeModal();
        });

        $("delete-all-btn")?.addEventListener("click", () => {
            if (!pendingDeleteEvent) return;
            const gid = pendingDeleteEvent.groupId;
            events = events.filter((item) => item.groupId !== gid);
            saveEvents();
            renderCalendar();
            closeDeleteModal();
            closeModal();
        });

        $("cancel-delete-modal-btn")?.addEventListener("click", closeDeleteModal);
    </script>
</body>

</html>
