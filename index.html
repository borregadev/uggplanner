<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UGG Knightsbridge Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Custom subtle scrollbar for month strip */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Event Color Swatches (12 Colors) */
    .evt-blue    { background-color: #dbeafe; color: #1e40af; border-left: 3px solid #2563eb; }
    .evt-emerald { background-color: #d1fae5; color: #065f46; border-left: 3px solid #059669; }
    .evt-purple  { background-color: #f3e8ff; color: #6b21a8; border-left: 3px solid #9333ea; }
    .evt-amber   { background-color: #fef3c7; color: #92400e; border-left: 3px solid #d97706; }
    .evt-rose    { background-color: #ffe4e6; color: #9f1239; border-left: 3px solid #e11d48; }
    .evt-indigo  { background-color: #e0e7ff; color: #3730a3; border-left: 3px solid #4f46e5; }
    .evt-teal    { background-color: #ccfbf1; color: #115e59; border-left: 3px solid #0d9488; }
    .evt-cyan    { background-color: #cffafe; color: #155e75; border-left: 3px solid #0891b2; }
    .evt-violet  { background-color: #ede9fe; color: #5b21b6; border-left: 3px solid #7c3aed; }
    .evt-pink    { background-color: #fce7f3; color: #9d174d; border-left: 3px solid #db2777; }
    .evt-orange  { background-color: #ffedd5; color: #9a3412; border-left: 3px solid #ea580c; }
    .evt-slate   { background-color: #f1f5f9; color: #334155; border-left: 3px solid #475569; }

    /* Print / A4 PDF Export Rules */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }

      body {
        background: #ffffff !important;
        color: #0f172a !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .no-print {
        display: none !important;
      }

      #app-container {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      #calendar-card {
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
        border-radius: 0 !important;
      }

      #weekday-header {
        border-bottom: 1px solid #cbd5e1 !important;
        background-color: #f8fafc !important;
      }

      #weekday-header > div {
        border-right: 1px solid #e2e8f0 !important;
        color: #334155 !important;
      }

      #weekday-header > div:last-child {
        border-right: none !important;
      }

      #calendar-grid {
        border-collapse: collapse !important;
      }

      .day-cell {
        min-height: 112px !important;
        height: auto !important;
        border-right: 1px solid #e2e8f0 !important;
        border-bottom: 1px solid #e2e8f0 !important;
        page-break-inside: avoid;
      }

      .day-cell:nth-child(7n) {
        border-right: none !important;
      }

      .day-cell:nth-last-child(-n+7) {
        border-bottom: none !important;
      }

      /* Do NOT highlight current day badge on saved PDF */
      .is-today-badge {
        background-color: transparent !important;
        color: #0f172a !important;
        font-weight: 600 !important;
        width: auto !important;
        height: auto !important;
        padding: 0 !important;
        border-radius: 0 !important;
      }

      .day-number-current {
        color: #0f172a !important;
      }
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-blue-100">

  <div id="app-container" class="max-w-6xl mx-auto px-2 sm:px-6 py-3 sm:py-6">

    <!-- Header Section -->
    <header class="flex flex-col items-center text-center mb-3 sm:mb-5">
      <div class="flex items-center justify-center gap-2">
        <h1 id="current-month-title" class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">
          November 2026
        </h1>
        <!-- Live Cloud Sync Status Badge -->
        <span id="sync-status-badge" class="no-print inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 border border-slate-200 transition-colors">
          <span id="sync-status-dot" class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
          <span id="sync-status-text">Local Mode</span>
        </span>
      </div>
      <p class="text-xs sm:text-sm font-medium text-slate-500 tracking-wide uppercase mt-0.5">
        UGG Knightsbridge
      </p>

      <!-- Action Toolbar -->
      <div class="no-print flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 mt-3 w-full">
        <button id="prev-month-btn" type="button" aria-label="Previous Month"
          class="min-h-[40px] px-3 py-1.5 text-xs sm:text-sm font-medium bg-white border border-slate-200 rounded-lg text-slate-700 hover:bg-slate-50 active:bg-slate-100 transition">
          &larr; Prev
        </button>

        <button id="today-btn" type="button"
          class="min-h-[40px] px-3.5 py-1.5 text-xs sm:text-sm font-semibold bg-slate-900 text-white rounded-lg hover:bg-slate-800 active:bg-slate-700 transition">
          Today
        </button>

        <button id="next-month-btn" type="button" aria-label="Next Month"
          class="min-h-[40px] px-3 py-1.5 text-xs sm:text-sm font-medium bg-white border border-slate-200 rounded-lg text-slate-700 hover:bg-slate-50 active:bg-slate-100 transition">
          Next &rarr;
        </button>

        <div class="hidden sm:block h-5 w-px bg-slate-200 mx-1"></div>

        <button id="add-event-header-btn" type="button"
          class="min-h-[40px] px-3.5 py-1.5 text-xs sm:text-sm font-semibold bg-blue-600 text-white rounded-lg hover:bg-blue-700 active:bg-blue-800 transition shadow-sm">
          + Event
        </button>

        <button id="print-pdf-btn" type="button"
          class="min-h-[40px] px-3 py-1.5 text-xs sm:text-sm font-medium bg-white border border-slate-200 rounded-lg text-slate-700 hover:bg-slate-50 active:bg-slate-100 transition">
          Save PDF
        </button>

        <button id="save-backup-btn" type="button"
          class="min-h-[40px] px-3 py-1.5 text-xs sm:text-sm font-medium bg-white border border-slate-200 rounded-lg text-slate-700 hover:bg-slate-50 active:bg-slate-100 transition">
          Save Backup
        </button>

        <label for="restore-file-input"
          class="min-h-[40px] inline-flex items-center justify-center px-3 py-1.5 text-xs sm:text-sm font-medium bg-white border border-slate-200 rounded-lg text-slate-700 hover:bg-slate-50 active:bg-slate-100 transition cursor-pointer select-none">
          Restore Backup
          <input id="restore-file-input" type="file" accept=".json,application/json,text/plain" class="sr-only" />
        </label>
      </div>

      <!-- Centered Month Navigation Strip -->
      <nav id="month-tabs" aria-label="Month Navigation"
        class="no-print flex items-center justify-start sm:justify-center gap-1.5 overflow-x-auto no-scrollbar w-full mt-3 pb-1 px-1">
      </nav>
    </header>

    <!-- Calendar Card -->
    <main id="calendar-card" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <!-- Weekday Header -->
      <div id="weekday-header" class="grid grid-cols-7 bg-slate-50 border-b border-slate-200 text-center text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500">
        <div class="py-2 sm:py-2.5 border-r border-slate-100"><span class="sm:hidden">M</span><span class="hidden sm:inline">Mon</span></div>
        <div class="py-2 sm:py-2.5 border-r border-slate-100"><span class="sm:hidden">T</span><span class="hidden sm:inline">Tue</span></div>
        <div class="py-2 sm:py-2.5 border-r border-slate-100"><span class="sm:hidden">W</span><span class="hidden sm:inline">Wed</span></div>
        <div class="py-2 sm:py-2.5 border-r border-slate-100"><span class="sm:hidden">T</span><span class="hidden sm:inline">Thu</span></div>
        <div class="py-2 sm:py-2.5 border-r border-slate-100"><span class="sm:hidden">F</span><span class="hidden sm:inline">Fri</span></div>
        <div class="py-2 sm:py-2.5 border-r border-slate-100"><span class="sm:hidden">S</span><span class="hidden sm:inline">Sat</span></div>
        <div class="py-2 sm:py-2.5"><span class="sm:hidden">S</span><span class="hidden sm:inline">Sun</span></div>
      </div>

      <!-- 7-Column Day Grid -->
      <div id="calendar-grid" class="grid grid-cols-7 divide-x divide-y divide-slate-100"></div>
    </main>

  </div>

  <!-- Toast Notification -->
  <div id="toast-banner" class="no-print fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs sm:text-sm font-medium shadow-lg transition-opacity duration-200"></div>

  <!-- Add / Edit Event Modal -->
  <div id="event-modal" class="no-print fixed inset-0 z-40 hidden bg-slate-900/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl shadow-xl border border-slate-200 p-5 sm:p-6 max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h2 id="modal-title" class="text-lg font-bold text-slate-900">Add Event</h2>
        <button id="close-modal-btn" type="button" class="w-9 h-9 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 text-xl leading-none">&times;</button>
      </div>

      <form id="event-form" class="space-y-4">
        <input type="hidden" id="event-id" />
        <input type="hidden" id="event-group-id" />

        <div>
          <label for="event-title" class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-1">Event Title</label>
          <input id="event-title" type="text" required placeholder="e.g., Store Delivery, Shift, Staff Meeting"
            class="w-full px-3.5 py-2.5 text-base sm:text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="event-start" class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-1">Start Date</label>
            <input id="event-start" type="date" required
              class="w-full px-3 py-2.5 text-base sm:text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label for="event-end" class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-1">End Date</label>
            <input id="event-end" type="date" required
              class="w-full px-3 py-2.5 text-base sm:text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="event-time" class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-1">Time (Optional)</label>
            <input id="event-time" type="text" placeholder="e.g., 09:00 - 17:30"
              class="w-full px-3 py-2.5 text-base sm:text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label for="event-repeat" class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-1">Repeat</label>
            <select id="event-repeat"
              class="w-full px-3 py-2.5 text-base sm:text-sm border border-slate-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="none">Does not repeat</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="biweekly">Bi-weekly (Every 2 weeks)</option>
              <option value="monthly">Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-1.5">Tag Color</label>
          <div id="color-picker" class="flex flex-wrap gap-2"></div>
        </div>

        <div>
          <label for="event-notes" class="block text-xs font-semibold uppercase tracking-wide text-slate-600 mb-1">Notes (Optional)</label>
          <textarea id="event-notes" rows="2" placeholder="Additional details..."
            class="w-full px-3.5 py-2 text-base sm:text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div class="flex items-center justify-between pt-2 gap-2">
          <button id="delete-event-btn" type="button"
            class="hidden min-h-[44px] px-4 py-2 text-sm font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl transition">
            Delete
          </button>
          <div class="flex items-center gap-2 ml-auto">
            <button id="cancel-modal-btn" type="button"
              class="min-h-[44px] px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">
              Cancel
            </button>
            <button type="submit"
              class="min-h-[44px] px-5 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm transition">
              Save Event
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Recurring Event Delete Confirmation Modal -->
  <div id="delete-recurring-modal" class="no-print fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl shadow-xl border border-slate-200 p-5 sm:p-6">
      <h3 class="text-base font-bold text-slate-900">Delete Recurring Event</h3>
      <p class="text-xs sm:text-sm text-slate-500 mt-1 mb-4">This event repeats. Which occurrences would you like to delete?</p>
      <div class="flex flex-col gap-2">
        <button id="del-single-btn" type="button"
          class="w-full min-h-[44px] px-4 py-2.5 text-sm font-medium text-left text-slate-800 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl transition">
          Only this event
        </button>
        <button id="del-following-btn" type="button"
          class="w-full min-h-[44px] px-4 py-2.5 text-sm font-medium text-left text-slate-800 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl transition">
          This and following events
        </button>
        <button id="del-all-btn" type="button"
          class="w-full min-h-[44px] px-4 py-2.5 text-sm font-semibold text-left text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-xl transition">
          All events in series
        </button>
        <button id="cancel-delete-modal-btn" type="button"
          class="w-full min-h-[42px] mt-1 px-4 py-2 text-sm font-medium text-center text-slate-500 hover:text-slate-700 rounded-xl transition">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // JSONBIN.IO CLOUD SYNC CONFIGURATION (PASTE YOUR CREDENTIALS BELOW)
    // =========================================================================
    const JSONBIN_BIN_ID = "https://api.jsonbin.io/v3/b/6afd5ef7ffd5d16053cab40b";         // e.g. "673a9f2be41b4d34e4567890"
    const JSONBIN_MASTER_KEY = "$2a$10$NXHdVDMaEkbCrNMVAHPPPOIcfzSikYi7fu.R7x7SRw2wP7GNxQvjy"; // e.g. "$2a$10$..."
    // =========================================================================

    const STORAGE_KEY = "ugg_knightsbridge_planner_events_v1";
    const SERIES_END_LIMIT = "2027-12-31";

    const MONTHS = [
      { year: 2026, month: 10, label: "Nov 2026", full: "November 2026" },
      { year: 2026, month: 11, label: "Dec 2026", full: "December 2026" },
      { year: 2027, month: 0,  label: "Jan 2027", full: "January 2027" },
      { year: 2027, month: 1,  label: "Feb 2027", full: "February 2027" },
      { year: 2027, month: 2,  label: "Mar 2027", full: "March 2027" },
      { year: 2027, month: 3,  label: "Apr 2027", full: "April 2027" },
      { year: 2027, month: 4,  label: "May 2027", full: "May 2027" },
      { year: 2027, month: 5,  label: "Jun 2027", full: "June 2027" },
      { year: 2027, month: 6,  label: "Jul 2027", full: "July 2027" },
      { year: 2027, month: 7,  label: "Aug 2027", full: "August 2027" },
      { year: 2027, month: 8,  label: "Sep 2027", full: "September 2027" },
      { year: 2027, month: 9,  label: "Oct 2027", full: "October 2027" },
      { year: 2027, month: 10, label: "Nov 2027", full: "November 2027" },
      { year: 2027, month: 11, label: "Dec 2027", full: "December 2027" }
    ];

    const COLORS = [
      { id: "blue",    name: "Blue",    swatch: "#2563eb" },
      { id: "emerald", name: "Emerald", swatch: "#059669" },
      { id: "purple",  name: "Purple",  swatch: "#9333ea" },
      { id: "amber",   name: "Amber",   swatch: "#d97706" },
      { id: "rose",    name: "Rose",    swatch: "#e11d48" },
      { id: "indigo",  name: "Indigo",  swatch: "#4f46e5" },
      { id: "teal",    name: "Teal",    swatch: "#0d9488" },
      { id: "cyan",    name: "Cyan",    swatch: "#0891b2" },
      { id: "violet",  name: "Violet",  swatch: "#7c3aed" },
      { id: "pink",    name: "Pink",    swatch: "#db2777" },
      { id: "orange",  name: "Orange",  swatch: "#ea580c" },
      { id: "slate",   name: "Slate",   swatch: "#475569" }
    ];

    let activeMonthIndex = 0;
    let selectedColor = "blue";
    let events = [];
    let pendingDeleteEvent = null;

    const $ = (id) => document.getElementById(id);

    function isCloudConfigured() {
      return (
        JSONBIN_BIN_ID &&
        JSONBIN_MASTER_KEY &&
        JSONBIN_BIN_ID !== "YOUR_BIN_ID_HERE" &&
        JSONBIN_MASTER_KEY !== "YOUR_MASTER_KEY_HERE"
      );
    }

    function updateSyncBadge(state, label) {
      const dot = $("sync-status-dot");
      const text = $("sync-status-text");
      if (!dot || !text) return;

      text.textContent = label;
      dot.className = "w-1.5 h-1.5 rounded-full ";
      if (state === "synced") {
        dot.className += "bg-emerald-500";
      } else if (state === "syncing") {
        dot.className += "bg-amber-400 animate-pulse";
      } else if (state === "error") {
        dot.className += "bg-rose-500";
      } else {
        dot.className += "bg-slate-400";
      }
    }

    function showToast(message) {
      const toast = $("toast-banner");
      if (!toast) return;
      toast.textContent = message;
      toast.classList.remove("hidden");
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.add("hidden");
      }, 3200);
    }

    // Load from localStorage first for instant display
    function loadLocalEvents() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        events = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(events)) events = [];
      } catch {
        events = [];
      }
    }

    // Pull latest events from JSONBin.io
    async function pullFromCloud() {
      if (!isCloudConfigured()) {
        updateSyncBadge("local", "Local Storage");
        return;
      }

      updateSyncBadge("syncing", "Syncing...");
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          method: "GET",
          headers: {
            "X-Master-Key": JSONBIN_MASTER_KEY
          }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const remoteEvents = Array.isArray(data?.record?.events)
          ? data.record.events
          : Array.isArray(data?.record)
          ? data.record
          : null;

        if (remoteEvents !== null) {
          events = remoteEvents;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
          renderCalendar();
        }
        updateSyncBadge("synced", "Cloud Synced");
      } catch (err) {
        console.error("JSONBin pull error:", err);
        updateSyncBadge("error", "Sync Offline");
      }
    }

    // Push updated events to JSONBin.io
    async function pushToCloud() {
      if (!isCloudConfigured()) return;

      updateSyncBadge("syncing", "Saving...");
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": JSONBIN_MASTER_KEY
          },
          body: JSON.stringify({
            updatedAt: new Date().toISOString(),
            events
          })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        updateSyncBadge("synced", "Cloud Synced");
      } catch (err) {
        console.error("JSONBin push error:", err);
        updateSyncBadge("error", "Sync Offline");
        showToast("Saved locally (Cloud sync offline)");
      }
    }

    function saveEvents() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      pushToCloud();
    }

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      const d = String(dateObj.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function parseDateKey(str) {
      return new Date(`${str}T00:00:00`);
    }

    function getEventDurationDays(evt) {
      const start = parseDateKey(evt.startDate);
      const end = parseDateKey(evt.endDate || evt.startDate);
      const diff = Math.round((end - start) / (1000 * 60 * 60 * 24));
      return Math.max(1, diff + 1);
    }

    function generateRecurringEvents(baseEvent) {
      const repeat = baseEvent.repeat || "none";
      const startObj = parseDateKey(baseEvent.startDate);
      const endObj = parseDateKey(baseEvent.endDate || baseEvent.startDate);
      const spanDays = Math.max(0, Math.round((endObj - startObj) / (1000 * 60 * 60 * 24)));
      const groupId = baseEvent.groupId || `grp_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;

      if (repeat === "none") {
        return [{
          ...baseEvent,
          id: baseEvent.id || `evt_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          groupId: null,
          repeat: "none"
        }];
      }

      const generated = [];
      const limitObj = parseDateKey(SERIES_END_LIMIT);
      let index = 0;

      while (true) {
        const currentStart = new Date(startObj);
        if (repeat === "daily") {
          currentStart.setDate(startObj.getDate() + index);
        } else if (repeat === "weekly") {
          currentStart.setDate(startObj.getDate() + index * 7);
        } else if (repeat === "biweekly") {
          currentStart.setDate(startObj.getDate() + index * 14);
        } else if (repeat === "monthly") {
          currentStart.setMonth(startObj.getMonth() + index);
        } else if (repeat === "yearly") {
          currentStart.setFullYear(startObj.getFullYear() + index);
        }

        if (currentStart > limitObj || index > 800) break;

        const currentEnd = new Date(currentStart);
        currentEnd.setDate(currentStart.getDate() + spanDays);

        generated.push({
          ...baseEvent,
          id: `evt_${Date.now()}_${index}_${Math.random().toString(36).slice(2, 7)}`,
          groupId,
          startDate: formatDateKey(currentStart),
          endDate: formatDateKey(currentEnd),
          repeat
        });

        index++;
      }

      return generated;
    }

    function buildMonthTabs() {
      const container = $("month-tabs");
      if (!container) return;
      container.innerHTML = "";

      MONTHS.forEach((m, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = m.label;
        const isActive = idx === activeMonthIndex;
        btn.className = isActive
          ? "shrink-0 min-h-[36px] px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-900 text-white shadow-xs transition"
          : "shrink-0 min-h-[36px] px-3 py-1.5 text-xs font-medium rounded-lg bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition";

        btn.addEventListener("click", () => {
          activeMonthIndex = idx;
          renderCalendar();
        });

        container.appendChild(btn);
      });

      const activeBtn = container.children[activeMonthIndex];
      if (activeBtn) {
        activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }
    }

    function renderCalendar() {
      const current = MONTHS[activeMonthIndex];
      const titleEl = $("current-month-title");
      if (titleEl) titleEl.textContent = current.full;

      buildMonthTabs();

      const grid = $("calendar-grid");
      if (!grid) return;
      grid.innerHTML = "";

      const firstDayOfMonth = new Date(current.year, current.month, 1);
      const startWeekday = (firstDayOfMonth.getDay() + 6) % 7; // Monday = 0
      const daysInMonth = new Date(current.year, current.month + 1, 0).getDate();
      const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;

      const todayStr = formatDateKey(new Date());

      for (let i = 0; i < totalCells; i++) {
        const dayNum = i - startWeekday + 1;
        const cellDate = new Date(current.year, current.month, dayNum);
        const dateKey = formatDateKey(cellDate);
        const isCurrentMonth = dayNum >= 1 && dayNum <= daysInMonth;
        const isToday = dateKey === todayStr;

        const cell = document.createElement("div");
        cell.className = `day-cell min-h-[82px] sm:min-h-[118px] p-1 sm:p-1.5 flex flex-col transition cursor-pointer ${
          isCurrentMonth ? "bg-white hover:bg-slate-50/70" : "bg-slate-50/60 text-slate-400"
        }`;

        cell.addEventListener("click", (e) => {
          if (e.target.closest(".event-pill")) return;
          openAddModal(dateKey);
        });

        const topRow = document.createElement("div");
        topRow.className = "flex items-center justify-between mb-1";

        const badge = document.createElement("span");
        badge.textContent = cellDate.getDate();
        if (isToday) {
          badge.className =
            "is-today-badge inline-flex items-center justify-center w-6 h-6 text-xs font-bold rounded-full bg-blue-600 text-white";
        } else {
          badge.className = `text-xs font-semibold px-1 ${
            isCurrentMonth ? "day-number-current text-slate-700" : "text-slate-400"
          }`;
        }
        topRow.appendChild(badge);
        cell.appendChild(topRow);

        const dayEvents = events.filter((evt) => {
          const s = evt.startDate;
          const e = evt.endDate || evt.startDate;
          return dateKey >= s && dateKey <= e;
        });

        // Sort multi-day events to the top (longest duration first)
        dayEvents.sort((a, b) => {
          const durA = getEventDurationDays(a);
          const durB = getEventDurationDays(b);
          if (durB !== durA) return durB - durA;
          return (a.time || "").localeCompare(b.time || "");
        });

        const list = document.createElement("div");
        list.className = "flex flex-col gap-1 overflow-hidden";

        dayEvents.forEach((evt) => {
          const pill = document.createElement("button");
          pill.type = "button";
          pill.className = `event-pill evt-${evt.color || "blue"} w-full text-left px-1.5 py-0.5 rounded text-[10px] sm:text-[11px] font-medium truncate leading-tight hover:opacity-90 transition`;
          pill.textContent = evt.time ? `${evt.time} ${evt.title}` : evt.title;
          pill.title = evt.title;

          pill.addEventListener("click", (e) => {
            e.stopPropagation();
            openEditModal(evt);
          });

          list.appendChild(pill);
        });

        cell.appendChild(list);
        grid.appendChild(cell);
      }
    }

    function renderColorPicker() {
      const container = $("color-picker");
      if (!container) return;
      container.innerHTML = "";

      COLORS.forEach((c) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.title = c.name;
        btn.style.backgroundColor = c.swatch;
        const isSelected = selectedColor === c.id;
        btn.className = `w-9 h-9 rounded-full flex items-center justify-center text-white text-xs font-bold transition transform ${
          isSelected ? "ring-2 ring-offset-2 ring-slate-900 scale-105" : "opacity-85 hover:opacity-100"
        }`;
        btn.innerHTML = isSelected ? "&#10003;" : "";

        btn.addEventListener("click", () => {
          selectedColor = c.id;
          renderColorPicker();
        });

        container.appendChild(btn);
      });
    }

    function openAddModal(defaultDate) {
      $("modal-title").textContent = "Add Event";
      $("event-id").value = "";
      $("event-group-id").value = "";
      $("event-title").value = "";
      $("event-start").value = defaultDate || `${MONTHS[activeMonthIndex].year}-${String(MONTHS[activeMonthIndex].month + 1).padStart(2, "0")}-01`;
      $("event-end").value = $("event-start").value;
      $("event-time").value = "";
      $("event-repeat").value = "none";
      $("event-notes").value = "";
      selectedColor = "blue";
      renderColorPicker();
      $("delete-event-btn").classList.add("hidden");
      $("event-modal").classList.remove("hidden");
    }

    function openEditModal(evt) {
      $("modal-title").textContent = "Edit Event";
      $("event-id").value = evt.id;
      $("event-group-id").value = evt.groupId || "";
      $("event-title").value = evt.title || "";
      $("event-start").value = evt.startDate;
      $("event-end").value = evt.endDate || evt.startDate;
      $("event-time").value = evt.time || "";
      $("event-repeat").value = evt.repeat || "none";
      $("event-notes").value = evt.notes || "";
      selectedColor = evt.color || "blue";
      renderColorPicker();
      $("delete-event-btn").classList.remove("hidden");
      $("event-modal").classList.remove("hidden");
    }

    function closeModal() {
      $("event-modal").classList.add("hidden");
    }

    function closeDeleteModal() {
      $("delete-recurring-modal").classList.add("hidden");
      pendingDeleteEvent = null;
    }

    function handleSaveEvent(e) {
      e.preventDefault();
      const existingId = $("event-id").value;
      const existingGroupId = $("event-group-id").value;
      const title = $("event-title").value.trim();
      const startDate = $("event-start").value;
      let endDate = $("event-end").value || startDate;
      if (endDate < startDate) endDate = startDate;
      const time = $("event-time").value.trim();
      const repeat = $("event-repeat").value;
      const notes = $("event-notes").value.trim();

      if (!title || !startDate) return;

      // Remove old instance or entire series so frequency updates apply automatically across all events
      if (existingGroupId) {
        events = events.filter((item) => item.groupId !== existingGroupId);
      } else if (existingId) {
        events = events.filter((item) => item.id !== existingId);
      }

      const newItems = generateRecurringEvents({
        title,
        startDate,
        endDate,
        time,
        repeat,
        color: selectedColor,
        notes,
        groupId: repeat !== "none" ? (existingGroupId || `grp_${Date.now()}`) : null
      });

      events.push(...newItems);
      saveEvents();
      renderCalendar();
      closeModal();
    }

    function handleDeleteClick() {
      const existingId = $("event-id").value;
      const evt = events.find((item) => item.id === existingId);
      if (!evt) return;

      if (evt.groupId) {
        pendingDeleteEvent = evt;
        $("delete-recurring-modal").classList.remove("hidden");
      } else {
        events = events.filter((item) => item.id !== evt.id);
        saveEvents();
        renderCalendar();
        closeModal();
      }
    }

    function jumpToToday() {
      const now = new Date();
      const idx = MONTHS.findIndex((m) => m.year === now.getFullYear() && m.month === now.getMonth());
      activeMonthIndex = idx >= 0 ? idx : 0;
      renderCalendar();
    }

    function downloadBackup() {
      const payload = JSON.stringify({ app: "UGG Knightsbridge Planner", exportedAt: new Date().toISOString(), events }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ugg-knightsbridge-backup-${formatDateKey(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("Backup downloaded");
    }

    function extractEventsArray(rawText) {
      let cleaned = rawText.replace(/^\uFEFF/, "").trim();
      if (cleaned.startsWith("%7B") || cleaned.startsWith("%5B")) {
        cleaned = decodeURIComponent(cleaned);
      }
      let parsed = JSON.parse(cleaned);
      if (typeof parsed === "string") {
        parsed = JSON.parse(parsed);
      }
      if (Array.isArray(parsed)) return parsed;
      if (parsed && Array.isArray(parsed.events)) return parsed.events;
      if (parsed && parsed.record && Array.isArray(parsed.record.events)) return parsed.record.events;
      return null;
    }

    async function handleRestoreFile(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      try {
        let text = "";
        if (typeof file.text === "function") {
          text = await file.text();
        } else {
          text = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result || ""));
            reader.onerror = () => reject(reader.error);
            reader.readAsText(file);
          });
        }

        const restored = extractEventsArray(text);
        if (!restored) throw new Error("Invalid format");

        events = restored;
        saveEvents();
        renderCalendar();
        showToast(`Restored ${events.length} event${events.length === 1 ? "" : "s"}`);
      } catch {
        showToast("Could not read backup file");
      } finally {
        e.target.value = "";
      }
    }

    function setupSwipeGestures() {
      const card = $("calendar-card");
      if (!card) return;
      let startX = 0;
      let startY = 0;

      card.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
        }
      }, { passive: true });

      card.addEventListener("touchend", (e) => {
        if (!startX || !startY) return;
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const dx = endX - startX;
        const dy = endY - startY;

        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0 && activeMonthIndex < MONTHS.length - 1) {
            activeMonthIndex++;
            renderCalendar();
          } else if (dx > 0 && activeMonthIndex > 0) {
            activeMonthIndex--;
            renderCalendar();
          }
        }
        startX = 0;
        startY = 0;
      }, { passive: true });
    }

    // Initialize Application
    document.addEventListener("DOMContentLoaded", () => {
      loadLocalEvents();
      jumpToToday();
      pullFromCloud();
      setupSwipeGestures();

      $("prev-month-btn")?.addEventListener("click", () => {
        if (activeMonthIndex > 0) {
          activeMonthIndex--;
          renderCalendar();
        }
      });

      $("next-month-btn")?.addEventListener("click", () => {
        if (activeMonthIndex < MONTHS.length - 1) {
          activeMonthIndex++;
          renderCalendar();
        }
      });

      $("today-btn")?.addEventListener("click", jumpToToday);
      $("add-event-header-btn")?.addEventListener("click", () => openAddModal());
      $("print-pdf-btn")?.addEventListener("click", () => window.print());
      $("save-backup-btn")?.addEventListener("click", downloadBackup);
      $("restore-file-input")?.addEventListener("change", handleRestoreFile);

      $("close-modal-btn")?.addEventListener("click", closeModal);
      $("cancel-modal-btn")?.addEventListener("click", closeModal);
      $("event-form")?.addEventListener("submit", handleSaveEvent);
      $("delete-event-btn")?.addEventListener("click", handleDeleteClick);

      $("event-start")?.addEventListener("change", (e) => {
        if ($("event-end").value < e.target.value) {
          $("event-end").value = e.target.value;
        }
      });

      // Recurring Delete Modal Actions
      $("del-single-btn")?.addEventListener("click", () => {
        if (!pendingDeleteEvent) return;
        events = events.filter((item) => item.id !== pendingDeleteEvent.id);
        saveEvents();
        renderCalendar();
        closeDeleteModal();
        closeModal();
      });

      $("del-following-btn")?.addEventListener("click", () => {
        if (!pendingDeleteEvent) return;
        const cutoff = pendingDeleteEvent.startDate;
        const gid = pendingDeleteEvent.groupId;
        events = events.filter((item) => !(item.groupId === gid && item.startDate >= cutoff));
        saveEvents();
        renderCalendar();
        closeDeleteModal();
        closeModal();
      });

      $("del-all-btn")?.addEventListener("click", () => {
        if (!pendingDeleteEvent) return;
        const gid = pendingDeleteEvent.groupId;
        events = events.filter((item) => item.groupId !== gid);
        saveEvents();
        renderCalendar();
        closeDeleteModal();
        closeModal();
      });

      $("cancel-delete-modal-btn")?.addEventListener("click", closeDeleteModal);
    });
  </script>
</body>
